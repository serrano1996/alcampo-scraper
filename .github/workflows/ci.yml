# Spec 006 RF-9, plan-D5: the checks that close every task, on every push and
# pull request. Nothing is published. Python 3.11 is the minimum declared in
# pyproject.toml, so the code is proved on it (local development uses newer).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Fixed: no silent jump to the next Ubuntu (spec 014 RF-6).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          # The cache follows the lock, not the default requirements*.txt.
          cache-dependency-path: requirements-dev.lock

      # Spec 014 RF-4: the pinned dev dependencies and build backend with
      # hashes, the package alone built with them (nothing fetched unhashed,
      # spec 015 RF-6), and `pip check` fails if pyproject.toml declares
      # something the lock lacks (regenerate it with scripts/lock.sh).
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock
          pip install --no-deps --no-build-isolation -e .
          pip check

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      # Never calls Alcampo (respx, fakeredis); the compose tests use the docker CLI.
      - name: Tests
        run: pytest -q

      - name: Docker image
        run: docker build -t alcampo-scraper:ci .
