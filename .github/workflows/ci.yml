# Spec 006 RF-9, plan-D5: the checks that close every task, on every push and
# pull request. Nothing is published. Python 3.11 is the minimum declared in
# pyproject.toml, so the code is proved on it (local development uses newer).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      # Never calls Alcampo (respx, fakeredis); the compose tests use the docker CLI.
      - name: Tests
        run: pytest -q

      - name: Docker image
        run: docker build -t alcampo-scraper:ci .
